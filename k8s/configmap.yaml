apiVersion: v1
kind: ConfigMap
metadata:
  name: medusa-config
  namespace: medusa-dev
  labels:
    app: medusa
    environment: dev
data:
  NODE_ENV: "production"
  PORT: "9000"
  ADMIN_CORS: "http://localhost:7001,https://medusa.aksa.ai,https://admin.medusa.aksa.ai"
  STORE_CORS: "http://localhost:8000,https://medusa.aksa.ai"
  MEDUSA_ADMIN_ONBOARDING_TYPE: "default"
  MEDUSA_ADMIN_ONBOARDING_NEXT_JS: "true"
  # Disable file watching in production to avoid ENOSPC errors
  CHOKIDAR_USEPOLLING: "false"
  CHOKIDAR_INTERVAL: "1000"
  # Redis configuration will be set via secret
  # Database configuration will be set via secret